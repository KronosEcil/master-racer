name: Master Racer Scraper & Notification Cron

on:
  schedule:
    # Günde 2 kez: Öğlen 14:00 TR (11:00 UTC), Akşam 20:00 TR (17:00 UTC)
    - cron: '0 11,17 * * *'
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/scraper_cron.yml'
  workflow_dispatch: # GitHub web arayüzünden tek tıkla manuel tetikleme desteği

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Tarama ve Bildirim Motorunu Çalıştır
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRESTORE_COLLECTION: 'competitions'
        run: |
          python -m backend.scraper.main
